name: checks

# The automatable half of SCOPE.md's Done criteria. Everything here runs offline against committed
# files: no Claude account, no API calls, no bench runs. `claude plugin validate .` stays manual,
# because it needs the Claude Code CLI, which this workflow deliberately does not install.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fixture tests
        working-directory: bench/fixture
        run: node --test --test-reporter=tap 'test/**/*.test.js'

      - name: Markdown lint
        run: npx --yes markdownlint-cli@0.47.0 '*.md' 'docs/*.md' 'bench/*.md' 'skills/route/*.md' --config .markdownlint.json

      - name: Report matches the run data
        run: node bench/summarize.mjs --check

      - name: Manifests and skill frontmatter
        run: node scripts/check-manifests.mjs

      - name: Guide routing table matches the skill
        run: node scripts/sync-routing-table.mjs --check

      # The real schema check, which scripts/check-manifests.mjs only approximates. It needs the CLI,
      # so it runs last and under a timeout: an unauthenticated runner is exactly the environment this
      # has to work in, and a hang would otherwise burn the job's full allowance.
      - name: claude plugin validate
        timeout-minutes: 3
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
