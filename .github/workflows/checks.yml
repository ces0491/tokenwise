name: checks

# The automatable half of SCOPE.md's Done criteria. Everything here runs against committed files with
# no Claude account and no bench runs. The last step installs the Claude Code CLI, which is the only
# network dependency beyond npm.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Fixture tests
        working-directory: bench/fixture
        run: node --test --test-reporter=tap 'test/**/*.test.js'

      - name: Grader, matrix and chart tests
        run: node --test bench/graders.test.mjs bench/matrix.test.mjs bench/breakeven.test.mjs bench/stream.test.mjs experiments/doc-format/measure.test.mjs experiments/doc-format/pdf-wrap.test.mjs experiments/doc-format/recall.test.mjs experiments/ultratoken/ultratoken.test.mjs skills/setup/setup.test.mjs hooks/resume-guard.test.mjs hooks/switch-figure.test.mjs

      - name: Markdown lint
        run: npx --yes markdownlint-cli@0.49.1 '*.md' 'docs/*.md' 'bench/*.md' 'skills/*/*.md' 'experiments/*/*.md' --config .markdownlint.json

      - name: Report matches the run data
        run: node bench/summarize.mjs --check

      - name: Breakeven chart matches the run data
        run: node bench/breakeven.mjs --check

      - name: Matrix names exactly the published runs
        run: node scripts/check-matrix.mjs

      - name: Docs name the models the published runs used
        run: node scripts/check-models.mjs

      - name: Docs quote the same token profile
        run: node scripts/check-figures.mjs

      - name: Manifests and skill frontmatter
        run: node scripts/check-manifests.mjs

      - name: Guide routing table matches the skill
        run: node scripts/sync-routing-table.mjs --check

      # The real schema check. It needs the CLI installed but no account — verified working on an
      # unauthenticated runner — so it runs last, under a timeout in case a future version starts
      # asking for credentials. It validates the marketplace manifest only, which is why
      # check-manifests.mjs runs alongside it. The CLI is pinned so a new release cannot change the
      # result between two runs of the same commit; bump it deliberately.
      - name: claude plugin validate
        timeout-minutes: 3
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.280
          claude plugin validate .
